<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéQuiz – Pokémon Type Matcher</title>
    <meta
      name="description"
      content="Test your Pokémon knowledge! Guess the correct type for each Pokémon in this fun quiz game."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game">
      <header class="stats-bar2">
        <div class="brand2">
          <div class="pokeball-icon2" aria-label="Pokéball">
            <div class="pokeball-top2"></div>
            <div class="pokeball-middle2">
              <div class="pokeball-btn2"></div>
            </div>
            <div class="pokeball-bottom2"></div>
          </div>
          <span class="brand-name2">PokéQuiz</span>
        </div>

        <div class="level-progress2">
          <div class="level-badge2">
            LVL <span class="level-num-val">1</span>
          </div>
          <div class="xp-bar-wrapper2">
            <div class="xp-bar-bg2">
              <div
                class="xp-bar-fill2 xp-bar-fill-val"
                style="width: 0%"
              ></div>
            </div>
            <span class="xp-text2 xp-text-val">0 / 1000 XP</span>
          </div>
        </div>

        <div class="score-section2">
          <div class="score-main2">
            <div class="total-score-label2">TOTAL SCORE</div>
            <div class="total-score-value2 total-score-val">0</div>
          </div>
          <div class="lives-streak-col2">
            <div class="lives-display2">
              <span class="heart-icon">❤️</span>
              <span class="heart-icon">❤️</span>
              <span class="heart-icon">❤️</span>
            </div>
            <div class="streak-badge2 streak-badge-val">
              <span class="streak-icon2"><i class="fa-solid fa-meteor"></i></span> Streak:
              <span class="streak-count-val">0</span>
            </div>
          </div>
        </div>
      </header>

      <header class="stats-bar">
        <div class="stats-top-row">
          <div class="brand">
            <div class="pokeball-icon" aria-label="Pokéball">
              <div class="pokeball-top"></div>
              <div class="pokeball-middle">
                <div class="pokeball-btn"></div>
              </div>
              <div class="pokeball-bottom"></div>
            </div>
            <span class="brand-name">PokéQuiz</span>
          </div>

          <div class="score-section">
            <div class="score">
              <div class="total-score-label">TOTAL SCORE</div>
              <div class="total-score-value total-score-val">0</div>
            </div>
            <div class="lives-streak-col">
              <div class="lives-display">
                <span class="heart-icon">❤️</span>
                <span class="heart-icon">❤️</span>
                <span class="heart-icon">❤️</span>
              </div>
              <div class="streak-badge streak-badge-val">
                <span class="streak-icon"><i class="fa-solid fa-meteor"></i></span> Streak:
                <span class="streak-count-val">0</span>
              </div>
            </div>
          </div>
        </div>

        <div class="stats-bottom-row">
          <div class="level-badge">
            LVL <span class="level-num-val">1</span>
          </div>
          <div class="xp-bar-wrapper">
            <span class="xp-text xp-text-val">0 / 1000 XP</span>
            <div class="xp-bar-bg">
              <div class="xp-bar-fill xp-bar-fill-val" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </header>

      <main class="game-area">
        <div class="pokedex-container" id="pokedex-container">
          <img
            src="Assests/Rectangle_1.png"
            alt="Pokédex device"
            class="pokedex-gif"
            id="pokedex-gif"
          />

          <img class="pokemon-artwork" id="pokemon-artwork" alt="" />

          <div class="pokemon-name-display" id="pokemon-name-display">
  <span class="poke-question">What Type</span>
  <span class="poke-name-text" id="poke-name-text"></span>
  <span class="poke-question">is?</span>
</div>


          <div class="pokedex-loading" id="pokedex-loading">
            <div class="pokeball-spinner">
              <div class="pokeball-spinner-top"></div>
              <div class="pokeball-spinner-middle">
                <div class="pokeball-spinner-btn"></div>
              </div>
              <div class="pokeball-spinner-bottom"></div>
            </div>
            <p>Loading Pokémon…</p>
          </div>


          <div class="pokedex-error" id="pokedex-error">
            <p id="error-message">Something went wrong.</p>
            <button id="retry-btn" class="modal-btn">Retry</button>
          </div>
        </div>

        <div class="question-text" id="question-text">
          What type is this Pokémon?
        </div>

        <section
          class="answer-grid"
          id="answer-grid"
          aria-label="Type answer choices"
        >
          <button
            class="answer-btn type-electric"
            id="btn-0"
            data-type="Electric"
          >
            <span class="type-icon">⚡</span>
            <span class="type-label">Electric</span>
          </button>
          <button class="answer-btn type-fire" id="btn-1" data-type="Fire">
            <span class="type-icon">🔥</span>
            <span class="type-label">Fire</span>
          </button>
          <button class="answer-btn type-water" id="btn-2" data-type="Water">
            <span class="type-icon">💧</span>
            <span class="type-label">Water</span>
          </button>
          <button class="answer-btn type-grass" id="btn-3" data-type="Grass">
            <span class="type-icon">🌿</span>
            <span class="type-label">Grass</span>
          </button>
        </section>
      </main>

      <div
        class="result-overlay"
        id="result-overlay"
        role="dialog"
        aria-modal="true"
      >
        <div class="result-card" id="result-card">
          <div class="result-card-level" id="result-level">Level 1 Completed</div>
          <div class="result-card-art">
            <div class="result-check" id="result-icon-container">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
          </div>
          <div class="result-card-heading" id="result-heading">Correct!</div>
          <div class="result-card-sub" id="result-sub">You're a PokéMaster!</div>
          <div class="result-card-tip" id="result-tip"></div>
          <button class="result-card-btn" id="result-next-btn">Next Pokémon →</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
